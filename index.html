<div class="ai-interview">

  <h2 class="ai-interview__title">
    Что спросить у кандидата перед техническим интервью
  </h2>

  <p class="ai-interview__intro">
    Нажимайте на карточки и смотрите на что обратить внимание
  </p>

  <div class="ai-interview__grid">

    <!-- Карточка 1 -->
    <button class="flip-card" type="button" aria-pressed="false">
      <span class="flip-card__inner">

        <span class="flip-card__front">
          <span class="flip-card__number">01</span>
          <span class="flip-card__question">
            Как вы поймете, нужен ли для этой задачи ИИ?
          </span>
          <span class="flip-card__hint">
            Посмотреть ответ →
          </span>
        </span>

        <span class="flip-card__back">
          <span class="flip-card__back-title">
            Что искать в ответе
          </span>
          <span class="flip-card__text">
            Кандидат сначала оценивает процесс, объем операций,
            наличие правил и данных, а также цену ошибки.
            Он готов предложить обычную автоматизацию,
            если ИИ не дает преимуществ.
          </span>
          <span class="flip-card__warning">
            Насторожитесь, если кандидат выбирает модель еще до изучения процесса.
          </span>
        </span>

      </span>
    </button>

    <!-- Карточка 2 -->
    <button class="flip-card" type="button" aria-pressed="false">
      <span class="flip-card__inner">

        <span class="flip-card__front">
          <span class="flip-card__number">02</span>
          <span class="flip-card__question">
            Какую метрику предложите для пилотного проекта?
          </span>
          <span class="flip-card__hint">
            Посмотреть ответ →
          </span>
        </span>

        <span class="flip-card__back">
          <span class="flip-card__back-title">
            Что искать в ответе
          </span>
          <span class="flip-card__text">
            Кандидат связывает пилот с измеримым бизнес-результатом:
            временем обработки, стоимостью операции, долей ошибок,
            конверсией или оборачиваемостью.
          </span>
          <span class="flip-card__warning">
            Слабый ответ — оценивать успех только по факту запуска решения.
          </span>
        </span>

      </span>
    </button>

    <!-- Карточка 3 -->
    <button class="flip-card" type="button" aria-pressed="false">
      <span class="flip-card__inner">

        <span class="flip-card__front">
          <span class="flip-card__number">03</span>
          <span class="flip-card__question">
            Как будете проверять качество решения до запуска?
          </span>
          <span class="flip-card__hint">
            Посмотреть ответ →
          </span>
        </span>

        <span class="flip-card__back">
          <span class="flip-card__back-title">
            Что искать в ответе
          </span>
          <span class="flip-card__text">
            Хороший кандидат назовет тестовые примеры,
            пограничные случаи и критерии качества,
            а также объяснит, что система должна делать при ошибке.
          </span>
          <span class="flip-card__warning">
            Насторожитесь, если проверка сводится к нескольким удачным примерам.
          </span>
        </span>

      </span>
    </button>

    <!-- Карточка 4 -->
    <button class="flip-card" type="button" aria-pressed="false">
      <span class="flip-card__inner">

        <span class="flip-card__front">
          <span class="flip-card__number">04</span>
          <span class="flip-card__question">
            Что именно вы делали в предыдущем AI-проекте сами?
          </span>
          <span class="flip-card__hint">
            Посмотреть ответ →
          </span>
        </span>

        <span class="flip-card__back">
          <span class="flip-card__back-title">
            Что искать в ответе
          </span>
          <span class="flip-card__text">
            Кандидат четко отделяет свой вклад от результата команды:
            объясняет, какие решения принимал лично,
            что разрабатывал или проверял сам.
          </span>
          <span class="flip-card__warning">
            Плохой сигнал — много «мы» и невозможность объяснить личный вклад.
          </span>
        </span>

      </span>
    </button>

    <!-- Карточка 5 -->
    <button class="flip-card" type="button" aria-pressed="false">
      <span class="flip-card__inner">

        <span class="flip-card__front">
          <span class="flip-card__number">05</span>
          <span class="flip-card__question">
            Расскажите о пилоте, который пришлось остановить
          </span>
          <span class="flip-card__hint">
            Посмотреть ответ →
          </span>
        </span>

        <span class="flip-card__back">
          <span class="flip-card__back-title">
            Что искать в ответе
          </span>
          <span class="flip-card__text">
            Практик способен привести неудачный эксперимент
            и объяснить причину: не подтвердился эффект,
            качество оказалось недостаточным или затраты не оправдались.
          </span>
          <span class="flip-card__warning">
            Если все проекты были «успешными», стоит подробнее расспросить о результатах.
          </span>
        </span>

      </span>
    </button>

    <!-- Карточка 6 -->
    <button class="flip-card" type="button" aria-pressed="false">
      <span class="flip-card__inner">

        <span class="flip-card__front">
          <span class="flip-card__number">06</span>
          <span class="flip-card__question">
            Кто должен отвечать за решение после запуска?
          </span>
          <span class="flip-card__hint">
            Посмотреть ответ →
          </span>
        </span>

        <span class="flip-card__back">
          <span class="flip-card__back-title">
            Что искать в ответе
          </span>
          <span class="flip-card__text">
            Сильный кандидат думает дальше пилота:
            кто контролирует качество, отвечает за сбои,
            изменения, данные и развитие решения после запуска.
          </span>
          <span class="flip-card__warning">
            Слабый сигнал — считать проект завершенным сразу после запуска.
          </span>
        </span>

      </span>
    </button>

  </div>
</div>

<style>
  .ai-interview {
    --blue: #356aa5;
    --blue-dark: #285789;
    --blue-light: #eef5fb;
    --blue-light-hover: #e3eef8;
    --blue-border: #caddec;
    --text: #090909;

    width: 100%;
    max-width: 757px;
    margin: 0 auto;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  .ai-interview,
  .ai-interview * {
    box-sizing: border-box;
  }

  /* Заголовок */
  .ai-interview__title {
    margin: 0 0 9px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    line-height: 1.12;
    font-weight: 700;

    color: var(--text);
  }

  /* Подводка */
  .ai-interview__intro {
    max-width: 650px;
    margin: 0 0 20px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    line-height: 1.4;

    color: #222;
  }

  /* Сетка */
  .ai-interview__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    align-items: stretch;
  }

  /* Карточка */
  .flip-card {
    position: relative;
    width: 100%;
    min-height: 280px;

    padding: 0;
    margin: 0;
    border: 0;
    background: transparent;

    cursor: pointer;
    perspective: 1200px;
    font: inherit;
    text-align: left;

    -webkit-tap-highlight-color: transparent;
  }

  .flip-card__inner {
    position: relative;
    display: block;

    width: 100%;
    height: 100%;
    min-height: inherit;

    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.2, .7, .2, 1);
  }

  .flip-card.is-flipped .flip-card__inner {
    transform: rotateY(180deg);
  }

  .flip-card__front,
  .flip-card__back {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;

    width: 100%;
    height: 100%;
    padding: 17px;

    border: 1px solid var(--blue-border);
    border-radius: 5px;

    overflow: hidden;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .flip-card__front {
    background: var(--blue-light);
    color: var(--text);
  }

  .flip-card__back {
    background: var(--blue-light-hover);
    color: var(--text);

    transform: rotateY(180deg);
  }

  /* Номер — сверху, без auto-отступа */
  .flip-card__number {
    display: block;

    color: var(--blue);

    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    line-height: 1;
    font-weight: 700;
  }

  /* Вопрос — занимает все пространство между номером и подсказкой,
     текст центрируется по вертикали внутри этого пространства */
  .flip-card__question {
    display: flex;
    align-items: center;

    flex: 1;

    margin: 8px 0;

    color: var(--text);

    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.18;
    font-weight: 700;
  }

  /* Синяя подсказка — в 1.5 раза больше (было 11px) */
  .flip-card__hint {
    display: block;

    color: var(--blue);

    font-size: 16.5px;
    line-height: 1.25;
    font-weight: 700;
  }

  .flip-card__back-title {
    display: block;
    margin-bottom: 8px;

    color: var(--blue);

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    line-height: 1.15;
    font-weight: 700;
  }

  /* Текст ответа — на 20% больше (было 12.5px) */
  .flip-card__text {
    display: block;

    color: var(--text);

    font-size: 15px;
    line-height: 1.35;
  }

  /* Синее предупреждение — в 1.5 раза больше (было 11px) */
  .flip-card__warning {
    display: block;

    margin-top: auto;
    padding-top: 10px;

    border-top: 1px solid rgba(53, 106, 165, 0.2);

    color: var(--blue-dark);

    font-size: 16.5px;
    line-height: 1.28;
    font-weight: 700;
  }

  .flip-card:hover .flip-card__front {
    background: var(--blue-light-hover);
    border-color: var(--blue);

    box-shadow: 0 6px 18px rgba(53, 106, 165, 0.13);
  }

  .flip-card:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 3px;
    border-radius: 5px;
  }

  @media (max-width: 650px) {
    .ai-interview__grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .ai-interview__title {
      font-size: 23px;
    }

    .flip-card {
      min-height: 300px;
    }
  }

  @media (max-width: 430px) {
    .ai-interview__grid {
      grid-template-columns: 1fr;
    }

    .flip-card {
      min-height: 240px;
    }

    .ai-interview__title {
      font-size: 21px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .flip-card__inner {
      transition: none;
    }
  }
</style>

<script>
  document.querySelectorAll('.flip-card').forEach(function(card) {
    card.addEventListener('click', function() {
      const isFlipped = card.classList.toggle('is-flipped');

      card.setAttribute(
        'aria-pressed',
        isFlipped ? 'true' : 'false'
      );
    });
  });
</script>
